# Publishing Tamiz behind nginx with TLS.
# Tamiz listens on 127.0.0.1:8080 (see docker-compose.yml).

server {
    listen 443 ssl;
    server_name tamiz.example.org;

    ssl_certificate     /etc/letsencrypt/live/tamiz.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tamiz.example.org/privkey.pem;

    # An apply can take a while (validate, reload, verify on a slow server).
    proxy_read_timeout 180s;
    client_max_body_size 25m;   # pasted or uploaded logs (20 MB max)

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

